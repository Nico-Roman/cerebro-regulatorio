# Pipeline diario del corpus normativo.
#
# Antes esto vivía en el Programador de tareas de un notebook con Windows. El
# 7 de septiembre de 2026 llevaba 8 días caído y nada lo notó: el healthcheck
# respondía 200, la compuerta estaba en verde y la web servía normativa con 8
# días de atraso como si estuviera al día.
#
# Acá corre en infraestructura que siempre está encendida, deja logs de cada
# corrida y manda correo cuando falla. La compuerta de calidad sigue mandando:
# si el recall baja del gate o el motor deja de abstenerse, el job falla y NO
# se publica nada.
#
# ─────────────────────────────────────────────────────────────────────────────
# DESBLOQUEADO (2026-09-08). Corrida verde en runner GitHub-hosted:
# 121 documentos, 2.584 chunks, recall@5 16/16 = 100%, abstencion 5/5 = 100%
# — las mismas cifras que producia el PC.
#
# El bloqueo se habia diagnosticado como "el WAF del ISP rechaza IPs de
# datacenter". Eran tres bugs distintos, todos de la misma clase: codigo que
# funciona en Windows y falla en silencio en Linux.
#
#   1. El paso de verificacion TLS mandaba un curl sin User-Agent. El ISP corta
#      la conexion (curl 52) ante cualquier UA que no sea de navegador —
#      reproducible desde una IP residencial chilena, asi que la IP nunca fue
#      el problema. El scraper si mandaba UA; moria el paso previo.
#   2. Los enlaces del listado traen espacios y acentos sin escapar. curl los
#      rechazaba con exit 3 y 132 normas quedaban "pendientes" para siempre.
#      Ver urlSegura() en actualizar-diario.js.
#   3. Los PDF se bajan con el nombre en minusculas y los sidecars OCR
#      conservan la capitalizacion original. En Windows pareaban solos; en
#      Linux no, y 59 escaneos salian vacios. Ver buscar_sidecar() en
#      build_corpus.py.
#
# Faltaba ademas que ANAMED_Normativa/otros/ (31 PDF que no estan en el listado
# del ISP) viviera en el repo: ahora va por Git LFS.
#
# corpus-diario-local.yml y su runner self-hosted quedan sin motivo. La
# compuerta de calidad freno las tres corridas malas sin publicar nada: hizo
# exactamente su trabajo.
# ─────────────────────────────────────────────────────────────────────────────

name: Corpus diario

on:
  schedule:
    # 11:00 UTC = 08:00 en Chile (UTC-3).
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  # Dos corridas simultáneas commitearían el mismo corpus y chocarían al
  # empujar. Se encolan.
  group: corpus-diario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar PyMuPDF
        run: pip install --upgrade pip && pip install pymupdf

      # El servidor de www.ispch.gob.cl manda solo el certificado hoja y omite
      # el intermedio "GlobalSign GCC R6 AlphaSSL CA 2025". Windows lo resuelve
      # solo por AIA; OpenSSL en Ubuntu no, y curl aborta con error 60
      # ("unable to get local issuer certificate") antes de bajar nada. Se trae
      # el intermedio vigente desde el AIA del propio cert y, si GlobalSign no
      # responde, se usa la copia versionada en el repo.
      - name: Confiar el intermedio TLS que el ISP no envía en su cadena
        run: |
          set -e
          dst=/usr/local/share/ca-certificates/isp-alphassl-intermediate.crt
          if curl -fsS --max-time 20 http://secure.globalsign.com/cacert/gsgccr6alphasslca2025.crt -o /tmp/isp-int.der \
             && openssl x509 -inform DER -in /tmp/isp-int.der -out /tmp/isp-int.pem 2>/dev/null; then
            echo "Intermedio traído desde el AIA de GlobalSign."
            sudo cp /tmp/isp-int.pem "$dst"
          else
            echo "AIA de GlobalSign no disponible: uso la copia versionada."
            sudo cp vigilancia-isp/isp-alphassl-intermediate.pem "$dst"
          fi
          sudo update-ca-certificates
          # Falla acá con un mensaje claro si la cadena todavía no valida, en vez
          # de 20 pasos después en mitad del scrape.
          # El WAF del ISP corta la conexión (curl 52, "Empty reply") ante
          # cualquier User-Agent que no sea de navegador. Verificado el
          # 2026-09-08 desde una IP residencial chilena: sin UA, o con el UA
          # por defecto de curl, falla; con UA de Chrome responde 200 de forma
          # reproducible. Es el mismo UA que ya usa actualizar-diario.js.
          curl -sSf -o /dev/null -w 'ISP TLS OK (HTTP %{http_code})\n' --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36' \
            https://www.ispch.gob.cl/normativa-anamed/

      # Los 306 MB de PDF no están en el repo: se rebajan del ISP. La caché
      # evita rebajarlos todos los días. La clave sigue al snapshot del listado
      # oficial, así que cambia exactamente cuando cambia la normativa; el
      # restore-key recupera la caché anterior mientras tanto.
      #
      # Si la caché se pierde, no pasa nada grave: el paso de reconciliación
      # rebaja lo que falte. Lo que NO se puede perder son los sidecars OCR, y
      # por eso están versionados en el repo, no en la caché.
      - name: Restaurar caché de PDFs
        uses: actions/cache@v6
        with:
          path: ANAMED_Normativa
          key: anamed-pdfs-${{ hashFiles('vigilancia-isp/snapshots/latest.json') }}
          restore-keys: |
            anamed-pdfs-

      # Los 31 PDF de ANAMED_Normativa/otros/ no están en el listado del ISP —
      # se agregaron a mano y el paso 2b no puede rebajarlos— así que viven en
      # el repo por Git LFS. checkout NO los materializa (no se le pasa
      # `lfs: true` a propósito): deja punteros de 130 bytes.
      #
      # Por qué así y no `lfs: true`: son 116 MB por corrida contra 1 GB
      # gratis de ancho de banda LFS al mes, y con el schedule diario eso se
      # pasa de cuota en la primera semana. El caché de arriba ya guarda toda
      # la carpeta, así que en la corrida normal (caché caliente) los PDF ya
      # están y esto no descarga nada. Solo paga cuando el caché se pierde.
      - name: Materializar los PDF de otros/ si el caché no los trajo
        run: |
          set -e
          # Un puntero LFS es texto que empieza con esta línea; un PDF real
          # empieza con "%PDF". Basta mirar uno para saber en qué estado quedó
          # la carpeta, pero se recorren todos por si el caché vino parcial.
          if grep -rlq --include='*.pdf' '^version https://git-lfs' ANAMED_Normativa/otros/ 2>/dev/null; then
            echo "Hay punteros sin materializar: bajando de LFS."
            git lfs pull --include='ANAMED_Normativa/otros/*.pdf'
          else
            echo "El caché ya trajo los PDF reales: no se toca LFS."
          fi
          total=$(find ANAMED_Normativa/otros -name '*.pdf' | wc -l)
          punteros=$(grep -rl --include='*.pdf' '^version https://git-lfs' ANAMED_Normativa/otros/ 2>/dev/null | wc -l)
          echo "PDF en otros/: $total · sin materializar: $punteros"
          if [ "$punteros" -ne 0 ]; then
            echo "::error::Quedaron $punteros punteros LFS sin materializar; el corpus saldria incompleto."
            exit 1
          fi

      - name: Correr el pipeline (scrape, descarga, build, compuerta)
        env:
          CI: "true"
        run: node APP-Regulatoria/cerebro/actualizar-diario.js

      # Solo llega acá si la compuerta aprobó: actualizar-diario.js sale con
      # error si reprueba, y eso corta el job antes de commitear.
      - name: Publicar el corpus si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: el listado oficial no se movió y el corpus es idéntico."
            exit 0
          fi
          git commit -m "chore(corpus): actualización automática $(date -u +%Y-%m-%d)"
          git push

      # Sube el log de la corrida aunque el job haya fallado: cuando la
      # compuerta reprueba, el log es justamente lo que hay que leer.
      - name: Guardar el log de la corrida
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ github.run_id }}
          path: vigilancia-isp/logs/
          if-no-files-found: ignore
          retention-days: 30

# Respaldo de Postgres a un artefacto de GitHub.
#
# Existe porque los backups automáticos de Railway son del plan de pago, y la
# base ya tiene datos reales: cuentas, perfiles, consultas y reservas. Un
# respaldo semanal cifrado es la red mínima aceptable mientras tanto.
#
# Necesita dos secretos en Settings → Environments → Production (NO a nivel de
# repositorio: los demás secretos del proyecto viven en ese entorno, y el job
# declara `environment: Production` para poder leerlos):
#   DATABASE_PUBLIC_URL  la URL pública de Postgres en Railway (la privada
#                        .railway.internal no es alcanzable desde GitHub).
#   BACKUP_PASSPHRASE    una frase larga al azar. Sin ella el volcado viajaría
#                        en claro dentro del artefacto, y un artefacto no es un
#                        lugar donde dejar una base de datos legible.
#
# Un job que no declara `environment:` recibe los secretos del entorno VACÍOS,
# sin avisar. Eso ya rompió `resumen-semanal` y `vigia-frescura` el 2026-09-09;
# este workflow nació con el mismo defecto y se corrigió antes de su primera
# corrida.
#
# Para restaurar:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in respaldo.sql.gz.enc -pass pass:LA_FRASE | gunzip > respaldo.sql
#   psql "$DATABASE_PUBLIC_URL" -f respaldo.sql

name: Respaldo de Postgres

on:
  schedule:
    # Domingos 07:00 UTC = 04:00 en Chile, fuera de toda hora de uso.
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  respaldar:
    runs-on: ubuntu-latest
    # Da acceso a DATABASE_PUBLIC_URL y BACKUP_PASSPHRASE, que viven en el
    # entorno y no a nivel de repositorio.
    environment: Production
    steps:
      - name: Verificar que los secretos existan
        env:
          URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          FRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          faltan=""
          [ -n "$URL" ]   || faltan="$faltan DATABASE_PUBLIC_URL"
          [ -n "$FRASE" ] || faltan="$faltan BACKUP_PASSPHRASE"
          if [ -n "$faltan" ]; then
            echo "Faltan secretos:$faltan. Ver el encabezado de este workflow."
            exit 1
          fi

      - name: Volcar la base
        env:
          URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          # pg_dump corre dentro de la imagen oficial porque el cliente NUNCA
          # puede quedar atrás del servidor: pg_dump se niega a volcar una base
          # de una versión mayor que la suya. Esto no es teórico — la imagen
          # estaba fijada en 17 y Railway ya sirve PostgreSQL 18.6, y por eso
          # este paso falló con exit 1 el 11-09.
          #
          # Por eso la imagen NO va fijada a un major: Railway sube de versión
          # sin avisar, y un respaldo que se rompe en silencio cuando eso pasa
          # es justamente el tipo de falla que este repo trata de evitar. La
          # última estable siempre sabe volcar una base más vieja; al revés no.
          # La versión real del servidor queda en el log para poder diagnosticar.
          docker run --rm -e PGURL="$URL" postgres:alpine sh -c '
            psql "$PGURL" -tAc "select version()" >&2
            pg_dump --no-owner --no-privileges "$PGURL"
          ' > respaldo.sql
          bytes=$(stat -c%s respaldo.sql)
          echo "Volcado: $bytes bytes"
          # Un dump de una base con esquema aplicado no baja de unos pocos KB.
          # Si sale minúsculo, algo falló sin devolver error y no queremos
          # guardar un archivo vacío creyendo que hay respaldo.
          [ "$bytes" -gt 4096 ] || { echo "El volcado salió sospechosamente chico. Aborta."; exit 1; }

      - name: Comprimir y cifrar
        env:
          FRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gzip -9 respaldo.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in respaldo.sql.gz -out respaldo.sql.gz.enc -pass env:FRASE
          rm -f respaldo.sql.gz
          ls -la respaldo.sql.gz.enc

      - name: Guardar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-postgres-${{ github.run_id }}
          path: respaldo.sql.gz.enc
          retention-days: 90
          if-no-files-found: error
